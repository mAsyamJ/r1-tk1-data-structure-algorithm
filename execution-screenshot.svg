<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1020" viewBox="0 0 1050 1020">
<rect width="100%" height="100%" fill="#1e1e1e"/>
<rect width="100%" height="42" fill="#2d2d2d"/>
<circle cx="22" cy="21" r="6" fill="#ff5f56"/><circle cx="42" cy="21" r="6" fill="#ffbd2e"/><circle cx="62" cy="21" r="6" fill="#27c93f"/>
<text x="90" y="27" font-family="monospace" font-size="15" fill="#dddddd">java PlaylistOOP</text>
<text x="28" y="65" font-family="monospace" font-size="16" fill="#eeeeee">========================================</text>
<text x="28" y="89" font-family="monospace" font-size="16" fill="#eeeeee">   SISTEM MANAJEMEN PLAYLIST MUSIK</text>
<text x="28" y="113" font-family="monospace" font-size="16" fill="#eeeeee">========================================</text>
<text x="28" y="137" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="161" font-family="monospace" font-size="16" fill="#eeeeee">--- Demonstrasi Akses User ---</text>
<text x="28" y="185" font-family="monospace" font-size="16" fill="#eeeeee">Admin Playlist -&gt; Akses Admin: menambahkan lagu dan melihat daftar lagu.</text>
<text x="28" y="209" font-family="monospace" font-size="16" fill="#eeeeee">Member Playlist -&gt; Akses Member: melihat daftar lagu, mencari lagu, dan menghitung rata-rata durasi.</text>
<text x="28" y="233" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="257" font-family="monospace" font-size="16" fill="#eeeeee">--- Admin Menambahkan Lagu ---</text>
<text x="28" y="281" font-family="monospace" font-size="16" fill="#eeeeee">Lagu "Laskar Pelangi" berhasil ditambahkan.</text>
<text x="28" y="305" font-family="monospace" font-size="16" fill="#eeeeee">Lagu "Hati-Hati di Jalan" berhasil ditambahkan.</text>
<text x="28" y="329" font-family="monospace" font-size="16" fill="#eeeeee">Lagu "Bertaut" berhasil ditambahkan.</text>
<text x="28" y="353" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="377" font-family="monospace" font-size="16" fill="#eeeeee">--- Member Melihat Daftar Lagu ---</text>
<text x="28" y="401" font-family="monospace" font-size="16" fill="#eeeeee">=== Daftar Lagu untuk Member ===</text>
<text x="28" y="425" font-family="monospace" font-size="16" fill="#eeeeee">1.</text>
<text x="28" y="449" font-family="monospace" font-size="16" fill="#eeeeee">Judul  : Laskar Pelangi</text>
<text x="28" y="473" font-family="monospace" font-size="16" fill="#eeeeee">Artis  : Nidji</text>
<text x="28" y="497" font-family="monospace" font-size="16" fill="#eeeeee">Durasi : 4.05 menit</text>
<text x="28" y="521" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="545" font-family="monospace" font-size="16" fill="#eeeeee">2.</text>
<text x="28" y="569" font-family="monospace" font-size="16" fill="#eeeeee">Judul  : Hati-Hati di Jalan</text>
<text x="28" y="593" font-family="monospace" font-size="16" fill="#eeeeee">Artis  : Tulus</text>
<text x="28" y="617" font-family="monospace" font-size="16" fill="#eeeeee">Durasi : 4.02 menit</text>
<text x="28" y="641" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="665" font-family="monospace" font-size="16" fill="#eeeeee">3.</text>
<text x="28" y="689" font-family="monospace" font-size="16" fill="#eeeeee">Judul  : Bertaut</text>
<text x="28" y="713" font-family="monospace" font-size="16" fill="#eeeeee">Artis  : Nadin Amizah</text>
<text x="28" y="737" font-family="monospace" font-size="16" fill="#eeeeee">Durasi : 5.16 menit</text>
<text x="28" y="761" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="785" font-family="monospace" font-size="16" fill="#eeeeee">--- Member Mencari Lagu ---</text>
<text x="28" y="809" font-family="monospace" font-size="16" fill="#eeeeee">Lagu ditemukan:</text>
<text x="28" y="833" font-family="monospace" font-size="16" fill="#eeeeee">Judul  : Hati-Hati di Jalan</text>
<text x="28" y="857" font-family="monospace" font-size="16" fill="#eeeeee">Artis  : Tulus</text>
<text x="28" y="881" font-family="monospace" font-size="16" fill="#eeeeee">Durasi : 4.02 menit</text>
<text x="28" y="905" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="929" font-family="monospace" font-size="16" fill="#eeeeee">--- Rata-Rata Durasi Playlist ---</text>
<text x="28" y="953" font-family="monospace" font-size="16" fill="#eeeeee">Rata-rata durasi: 4.41 menit</text>
<text x="28" y="977" font-family="monospace" font-size="16" fill="#eeeeee"></text>
<text x="28" y="1001" font-family="monospace" font-size="16" fill="#eeeeee">Program selesai dijalankan tanpa error.</text>
</svg>